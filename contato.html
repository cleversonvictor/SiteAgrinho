<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | AGRO+VERDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --verde-neon: #00ff88;
            --fundo: #050a05;
            --texto: #e0ffe0;
            --vidro: rgba(0, 255, 136, 0.05);
            --borda-vidro: rgba(0, 255, 136, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Archivo', sans-serif;
            background: linear-gradient(135deg, var(--fundo) 0%, #020502 100%);
            color: var(--texto);
            min-height: 100vh;
        }
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1400px;
            background: rgba(5, 10, 5, 0.85);
            backdrop-filter: blur(25px);
            border: 1px solid var(--borda-vidro);
            border-radius: 100px;
            padding: 15px 30px;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo i { font-size: 2.2rem; color: var(--verde-neon); }
        .logo span {
            font-family: 'Clash Display', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--texto);
        }
        .logo span strong { color: var(--verde-neon); }
        .nav-links {
            display: flex;
            gap: 8px;
            list-style: none;
        }
        .nav-links a {
            padding: 12px 22px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 500;
            color: var(--texto);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-links a:hover, .nav-links a.active {
            background: var(--verde-neon);
            color: var(--fundo);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 120px 30px 60px;
        }
        h1 {
            font-family: 'Clash Display', sans-serif;
            font-size: 3.5rem;
            margin-bottom: 30px;
            text-align: center;
        }
        .gradient-text {
            background: linear-gradient(135deg, var(--verde-neon), #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .contact-form {
            background: var(--vidro);
            backdrop-filter: blur(15px);
            border: 1px solid var(--borda-vidro);
            border-radius: 40px;
            padding: 50px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--borda-vidro);
            border-radius: 20px;
            color: var(--texto);
            font-family: 'Archivo', sans-serif;
            font-size: 1rem;
        }
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        .btn {
            padding: 16px 40px;
            background: var(--verde-neon);
            color: var(--fundo);
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
        }
        .footer {
            padding: 40px 30px;
            border-top: 1px solid var(--borda-vidro);
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">
            <i class="fas fa-leaf"></i>
            <span>AGRO<strong>+</strong>VERDE</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Início</a></li>
            <li><a href="sustentabilidade.html"><i class="fas fa-globe"></i> Sustentabilidade</a></li>
            <li><a href="tecnologias.html"><i class="fas fa-microchip"></i> Tecnologias</a></li>
            <li><a href="contato.html" class="active"><i class="fas fa-envelope"></i> Contato</a></li>
            <li><a href="ia-ametista.html"><i class="fas fa-robot"></i> Ametista IA</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1><span class="gradient-text">Fale conosco</span></h1>
        
        <div class="contact-form">
            <form id="contactForm">
                <div class="form-group">
                    <input type="text" placeholder="Seu nome" required>
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Seu e-mail" required>
                </div>
                <div class="form-group">
                    <textarea placeholder="Sua mensagem..." required></textarea>
                </div>
                <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Enviar mensagem</button>
            </form>
            <p style="margin-top: 20px; text-align: center; opacity: 0.7;">
                <i class="fas fa-phone"></i> +55 (11) 99999-9999<br>
                <i class="fas fa-envelope"></i> contato@agroverde.com.br
            </p>
        </div>
    </div>

    <footer class="footer">
        <p style="font-size: 1.5rem; font-family: 'Clash Display';">AGRO<strong style="color: var(--verde-neon);">+</strong>VERDE</p>
        <p style="margin: 20px 0;"><strong>Feito por:</strong> Cleverson Victor | <strong style="color: #a855f7;">Ajuda:</strong> DeepSeek</p>
        <p>© 2026 · Agrinho 2026</p>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('✅ Mensagem enviada com sucesso! Entraremos em contato em breve.');
            e.target.reset();
        });
    </script>
</body>
</html>
