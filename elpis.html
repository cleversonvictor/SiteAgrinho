<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>???</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        .glitch-container {
            text-align: center;
            padding: 40px;
            position: relative;
        }
        
        .main-message {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            animation: glitchText 0.3s infinite;
            opacity: 0;
            animation: fadeIn 3s forwards, glitchText 0.2s infinite 3s;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        @keyframes glitchText {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 1px); }
            40% { transform: translate(2px, -1px); }
            60% { transform: translate(-1px, 2px); }
            80% { transform: translate(1px, -2px); }
        }
        
        .second-message {
            font-size: 1.8rem;
            color: #a855f7;
            margin-top: 40px;
            opacity: 0;
            animation: fadeIn 2s forwards 60s, glitchText 0.15s infinite 62s;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.8);
        }
        
        .morse-message {
            font-size: 2rem;
            color: #00ff88;
            margin-top: 60px;
            letter-spacing: 8px;
            opacity: 0;
            animation: fadeIn 3s forwards 300s, morseBlink 1s infinite 303s;
            text-shadow: 0 0 20px #00ff88;
        }
        
        @keyframes morseBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .translation {
            font-size: 1.2rem;
            color: #666;
            margin-top: 20px;
            opacity: 0;
            animation: fadeIn 2s forwards 305s;
        }
        
        .bug-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 0, 255, 0.02) 2px,
                rgba(255, 0, 255, 0.02) 4px
            );
            animation: scanlines 0.1s infinite;
        }
        
        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }
        
        .timer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #333;
            font-size: 0.8rem;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="bug-overlay"></div>
    
    <div class="glitch-container">
        <div class="main-message">
            A Elpis é a nossa única esperança
        </div>
        
        <div class="second-message">
            Unknown Studios vai ser a maior empresa de jogos daqui uns anos...
        </div>
        
        <div class="morse-message">
            ...- --- .-.. - . / .--. .-. .- / --- -. -.. . / ...- --- -.-. . / . ... - .- ...- .-
        </div>
        
        <div class="translation">
            "VOLTE PARA ONDE VOCÊ ESTAVA"
        </div>
    </div>
    
    <div class="timer" id="timer">00:00</div>
    
    <script>
        let seconds = 0;
        setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('timer').textContent = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }, 1000);
    </script>
</body>
</html>
