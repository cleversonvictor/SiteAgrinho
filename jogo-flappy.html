<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Plant | AGRO+VERDE</title>
    
    <!-- CORRIGIDO: Carregamento seguro de fontes (HTTPS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- CORRIGIDO: Font Awesome com HTTPS e fallback local caso falhe -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1a0a, #1a3a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Plus Jakarta Sans', 'Arial', sans-serif; /* Fonte de fallback */
            padding: 20px;
        }
        
        .game-wrapper {
            background: rgba(0, 255, 136, 0.05);
            backdrop-filter: blur(10px);
            border: 3px solid #00ff88;
            border-radius: 30px;
            padding: 20px 25px 25px;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.3);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 2rem;
            text-shadow: 0 0 20px #00ff88;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #00ff88;
            cursor: pointer;
            width: 100%; /* Torna responsivo */
            height: auto;
        }
        
        .score-display {
            text-align: center;
            margin: 20px 0;
            color: #ffd700;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            justify-content: space-around;
        }
        
        .controls {
            text-align: center;
            margin: 15px 0;
            color: #ccc;
            font-size: 0.9rem;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        
        .btn-primary {
            background: #ffd700;
            color: #0a1a0a;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px #ffd700;
        }
        
        .btn-secondary {
            background: #00ff88;
            color: #0a1a0a;
        }
        
        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px #00ff88;
        }
        
        .btn-outline {
            background: transparent;
            color: #00ff88;
            border: 2px solid #00ff88;
        }
        
        .btn-outline:hover {
            background: #00ff88;
            color: #0a1a0a;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <h1>
            <span>🌱</span> FLAPPY PLANT <span>🕊️</span>
        </h1>
        
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div class="score-display">
            <span>🌱 Score: <span id="scoreDisplay">0</span></span>
            <span>🏆 Best: <span id="bestScore">0</span></span>
        </div>
        
        <div class="controls">
            <p><i class="fas fa-mouse"></i> Clique ou pressione ESPAÇO para voar</p>
        </div>
        
        <div class="button-group">
            <button class="btn btn-primary" id="restartBtn"><i class="fas fa-redo"></i> Reiniciar</button>
            <a href="index.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
        </div>
    </div>

    <script>
        (function() {
            // ===== Garantir que o código rode apenas quando a página estiver 100% carregada =====
            window.addEventListener('load', function() {
                
                // ===== CONFIGURAÇÃO DO JOGO =====
                const canvas = document.getElementById('gameCanvas');
                const ctx = canvas.getContext('2d');
                const scoreDisplay = document.getElementById('scoreDisplay');
                const bestScoreDisplay = document.getElementById('bestScore');
                
                // ===== VARIÁVEIS DO JOGO =====
                let bird = {
                    y: 300,
                    velocity: 0,
                    radius: 12,
                    x: 70
                };
                
                let pipes = [];
                let score = 0;
                // CORRIGIDO: Verificação de segurança para localStorage
                let bestScore = 0;
                try {
                    bestScore = localStorage.getItem('flappyBest') || 0;
                } catch(e) {
                    console.warn("LocalStorage não está disponível.");
                }
                let gameOver = false;
                let gameStarted = false;
                let frameCount = 0;
                
                // Configurações de física (AJUSTADAS)
                const GRAVITY = 0.2;
                const JUMP_FORCE = -5;
                const PIPE_SPEED = 2;
                const PIPE_SPACING = 200;
                const PIPE_WIDTH = 50;
                const PIPE_GAP = 130;
                
                bestScoreDisplay.textContent = bestScore;
                
                // ===== CLASSE DO CANO =====
                class Pipe {
                    constructor() {
                        this.x = canvas.width;
                        this.top = Math.random() * (canvas.height - PIPE_GAP - 100) + 50;
                        this.bottom = this.top + PIPE_GAP;
                        this.passed = false;
                    }
                    
                    update() { this.x -= PIPE_SPEED; }
                    
                    draw() {
                        ctx.fillStyle = '#2e7d32';
                        ctx.fillRect(this.x, 0, PIPE_WIDTH, this.top);
                        ctx.fillStyle = '#1b5e20';
                        ctx.fillRect(this.x - 3, this.top - 20, PIPE_WIDTH + 6, 20);
                        ctx.fillStyle = '#2e7d32';
                        ctx.fillRect(this.x, this.bottom, PIPE_WIDTH, canvas.height - this.bottom);
                        ctx.fillStyle = '#1b5e20';
                        ctx.fillRect(this.x - 3, this.bottom, PIPE_WIDTH + 6, 20);
                    }
                    
                    checkCollision(bird) {
                        if (bird.x + bird.radius > this.x && bird.x - bird.radius < this.x + PIPE_WIDTH) {
                            if (bird.y - bird.radius < this.top || bird.y + bird.radius > this.bottom) {
                                return true;
                            }
                        }
                        return false;
                    }
                }
                
                // ===== DESENHA O PÁSSARO =====
                function drawBird() {
                    ctx.fillStyle = '#00ff88';
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(bird.x - 5, bird.y - 4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(bird.x + 5, bird.y - 4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath();
                    ctx.arc(bird.x - 5, bird.y - 5, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(bird.x + 5, bird.y - 5, 2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#ffa500';
                    ctx.beginPath();
                    ctx.moveTo(bird.x + 8, bird.y - 2);
                    ctx.lineTo(bird.x + 18, bird.y);
                    ctx.lineTo(bird.x + 8, bird.y + 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#66ffb3';
                    ctx.beginPath();
                    ctx.ellipse(bird.x, bird.y - 14, 6, 4, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // ===== DESENHA O FUNDO =====
                function drawBackground() {
                    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    gradient.addColorStop(0, '#87CEEB');
                    gradient.addColorStop(1, '#98D8C8');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.fillStyle = '#8B7355';
                    ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
                    ctx.fillStyle = '#6B5345';
                    ctx.fillRect(0, canvas.height - 15, canvas.width, 15);
                    ctx.fillStyle = '#4caf50';
                    for (let i = 0; i < canvas.width; i += 20) {
                        ctx.fillRect(i + (frameCount % 20), canvas.height - 25, 10, 10);
                    }
                }
                
                // ===== LÓGICA DO JOGO =====
                function update() {
                    if (!gameStarted || gameOver) return;
                    frameCount++;
                    bird.velocity += GRAVITY;
                    bird.y += bird.velocity;
                    
                    if (bird.y + bird.radius >= canvas.height - 20) {
                        gameOver = true;
                        bird.y = canvas.height - 20 - bird.radius;
                    }
                    if (bird.y - bird.radius <= 0) {
                        gameOver = true;
                        bird.y = bird.radius;
                    }
                    
                    if (frameCount % 90 === 0) pipes.push(new Pipe());
                    
                    pipes = pipes.filter(pipe => {
                        pipe.update();
                        if (pipe.checkCollision(bird)) gameOver = true;
                        if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
                            pipe.passed = true;
                            score++;
                            scoreDisplay.textContent = score;
                            if (score > bestScore) {
                                bestScore = score;
                                bestScoreDisplay.textContent = bestScore;
                                try { localStorage.setItem('flappyBest', bestScore); } catch(e) {}
                            }
                        }
                        return pipe.x + PIPE_WIDTH > 0;
                    });
                }
                
                // ===== DESENHA TUDO =====
                function draw() {
                    drawBackground();
                    pipes.forEach(pipe => pipe.draw());
                    drawBird();
                    
                    if (!gameStarted && !gameOver) {
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = '#00ff88';
                        ctx.font = 'bold 24px "Plus Jakarta Sans", Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('CLIQUE PARA COMEÇAR', canvas.width / 2, canvas.height / 2);
                    }
                    
                    if (gameOver) {
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = '#ff4444';
                        ctx.font = 'bold 30px "Plus Jakarta Sans", Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                        ctx.fillStyle = '#ffd700';
                        ctx.font = '20px "Plus Jakarta Sans", Arial';
                        ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 20);
                        if (score === bestScore && score > 0) {
                            ctx.fillStyle = '#00ff88';
                            ctx.fillText('🏆 NOVO RECORDE! 🏆', canvas.width / 2, canvas.height / 2 + 55);
                        }
                    }
                    
                    if (gameStarted && !gameOver) {
                        ctx.fillStyle = '#1a1a1a';
                        ctx.font = 'bold 30px "Plus Jakarta Sans", Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText(score, canvas.width / 2, 50);
                        ctx.fillStyle = '#00ff88';
                        ctx.fillText(score, canvas.width / 2 - 2, 48);
                    }
                }
                
                // ===== LOOP PRINCIPAL =====
                function gameLoop() {
                    update();
                    draw();
                    requestAnimationFrame(gameLoop);
                }
                
                // ===== REINICIA O JOGO =====
                function restart() {
                    bird = { y: 300, velocity: 0, radius: 12, x: 70 };
                    pipes = [];
                    score = 0;
                    gameOver = false;
                    gameStarted = false;
                    frameCount = 0;
                    scoreDisplay.textContent = '0';
                }
                
                // ===== CONTROLES =====
                function jump() {
                    if (!gameStarted && !gameOver) gameStarted = true;
                    if (!gameOver) bird.velocity = JUMP_FORCE;
                }
                
                // CORRIGIDO: Garantir que os botões existem antes de adicionar eventos
                const restartBtn = document.getElementById('restartBtn');
                if (restartBtn) {
                    restartBtn.addEventListener('click', restart);
                }
                
                canvas.addEventListener('click', () => {
                    if (gameOver) restart();
                    else jump();
                });
                
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        if (gameOver) restart();
                        else jump();
                    }
                    if (e.code === 'KeyR') restart();
                });
                
                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') e.preventDefault();
                }, false);
                
                // Inicia o jogo
                gameLoop();
            });
        })();
    </script>
</body>
</html>
