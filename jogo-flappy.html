<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Plant | AGRO+VERDE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1a0a, #1a3a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }
        
        .game-wrapper {
            background: rgba(0, 255, 136, 0.05);
            backdrop-filter: blur(10px);
            border: 3px solid #00ff88;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.3);
        }
        
        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 20px;
            font-size: 2rem;
            text-shadow: 0 0 20px #00ff88;
        }
        
        h1 i {
            margin: 0 10px;
        }
        
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #00ff88;
            cursor: pointer;
        }
        
        .score-display {
            text-align: center;
            margin-top: 20px;
            color: #ffd700;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .controls {
            text-align: center;
            margin-top: 20px;
            color: #ccc;
        }
        
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #00ff88;
            color: #0a1a0a;
            text-decoration: none;
            border-radius: 60px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px #00ff88;
        }
        
        .restart-btn {
            padding: 10px 25px;
            background: #ffd700;
            color: #0a1a0a;
            border: none;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 15px;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <h1>
            <i class="fas fa-seedling"></i>
            FLAPPY PLANT
            <i class="fas fa-dove"></i>
        </h1>
        
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div class="score-display">
            <span>🌱 Score: <span id="scoreDisplay">0</span></span>
            <span style="margin-left: 30px;">🏆 Best: <span id="bestScore">0</span></span>
        </div>
        
        <div class="controls">
            <p><i class="fas fa-mouse"></i> Clique ou pressione ESPAÇO para voar</p>
            <button class="restart-btn" id="restartBtn"><i class="fas fa-redo"></i> Reiniciar</button>
        </div>
        
        <div style="text-align: center;">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
        </div>
    </div>

    <script>
        // ===== CONFIGURAÇÃO DO JOGO =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const bestScoreDisplay = document.getElementById('bestScore');
        
        // ===== VARIÁVEIS DO JOGO =====
        let bird = {
            y: 300,
            velocity: 0,
            radius: 12
        };
        
        let pipes = [];
        let score = 0;
        let bestScore = localStorage.getItem('flappyBest') || 0;
        let gameOver = false;
        let gameStarted = false;
        let frameCount = 0;
        
        // Configurações de física (AJUSTADAS PARA NÃO FICAR MUITO RÁPIDO)
        const GRAVITY = 0.2;        // Gravidade mais suave
        const JUMP_FORCE = -5;       // Pulo mais controlado
        const PIPE_SPEED = 2;        // Velocidade dos canos
        const PIPE_SPACING = 200;    // Espaçamento entre canos
        const PIPE_WIDTH = 50;       // Largura do cano
        const PIPE_GAP = 130;        // Abertura entre canos (mais fácil)
        
        bestScoreDisplay.textContent = bestScore;
        
        // ===== CLASSE DO CANO =====
        class Pipe {
            constructor() {
                this.x = canvas.width;
                this.top = Math.random() * (canvas.height - PIPE_GAP - 100) + 50;
                this.bottom = this.top + PIPE_GAP;
                this.passed = false;
            }
            
            update() {
                this.x -= PIPE_SPEED;
            }
            
            draw() {
                // Cano de cima
                ctx.fillStyle = '#2e7d32';
                ctx.fillRect(this.x, 0, PIPE_WIDTH, this.top);
                
                // Borda do cano de cima
                ctx.fillStyle = '#1b5e20';
                ctx.fillRect(this.x - 3, this.top - 20, PIPE_WIDTH + 6, 20);
                
                // Cano de baixo
                ctx.fillStyle = '#2e7d32';
                ctx.fillRect(this.x, this.bottom, PIPE_WIDTH, canvas.height - this.bottom);
                
                // Borda do cano de baixo
                ctx.fillStyle = '#1b5e20';
                ctx.fillRect(this.x - 3, this.bottom, PIPE_WIDTH + 6, 20);
                
                // Detalhes decorativos
                ctx.fillStyle = '#4caf50';
                ctx.fillRect(this.x - 2, this.top - 15, PIPE_WIDTH + 4, 10);
                ctx.fillRect(this.x - 2, this.bottom + 5, PIPE_WIDTH + 4, 10);
            }
            
            checkCollision(bird) {
                // Colisão com os canos
                if (bird.x + bird.radius > this.x && bird.x - bird.radius < this.x + PIPE_WIDTH) {
                    if (bird.y - bird.radius < this.top || bird.y + bird.radius > this.bottom) {
                        return true;
                    }
                }
                return false;
            }
        }
        
        // ===== DESENHA O PÁSSARO (PLANTINHA) =====
        function drawBird() {
            // Corpo principal (verde)
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Olhos
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(bird.x - 5, bird.y - 4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(bird.x + 5, bird.y - 4, 4, 0, Math.PI * 2);
            ctx.fill();
            
            // Pupilas
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(bird.x - 5, bird.y - 5, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(bird.x + 5, bird.y - 5, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Bico
            ctx.fillStyle = '#ffa500';
            ctx.beginPath();
            ctx.moveTo(bird.x + 8, bird.y - 2);
            ctx.lineTo(bird.x + 18, bird.y);
            ctx.lineTo(bird.x + 8, bird.y + 2);
            ctx.fill();
            
            // Folhinha na cabeça
            ctx.fillStyle = '#66ffb3';
            ctx.beginPath();
            ctx.ellipse(bird.x, bird.y - 14, 6, 4, 0.3, 0, Math.PI * 2);
            ctx.fill();
            
            // Rotação baseada na velocidade
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(bird.velocity * 0.05);
            ctx.translate(-bird.x, -bird.y);
        }
        
        // ===== DESENHA O FUNDO =====
        function drawBackground() {
            // Céu gradiente
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#98D8C8');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Nuvens
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath();
            ctx.arc(50 + (frameCount * 0.1) % 400, 80, 25, 0, Math.PI * 2);
            ctx.arc(80 + (frameCount * 0.1) % 400, 70, 20, 0, Math.PI * 2);
            ctx.arc(30 + (frameCount * 0.1) % 400, 75, 18, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(250 + (frameCount * 0.05) % 400, 120, 30, 0, Math.PI * 2);
            ctx.arc(280 + (frameCount * 0.05) % 400, 110, 25, 0, Math.PI * 2);
            ctx.fill();
            
            // Chão
            ctx.fillStyle = '#8B7355';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            ctx.fillStyle = '#6B5345';
            ctx.fillRect(0, canvas.height - 15, canvas.width, 15);
            
            // Grama
            ctx.fillStyle = '#4caf50';
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.fillRect(i + (frameCount % 20), canvas.height - 25, 10, 10);
            }
        }
        
        // ===== ATUALIZA A LÓGICA DO JOGO =====
        function update() {
            if (!gameStarted || gameOver) return;
            
            frameCount++;
            
            // Física do pássaro
            bird.velocity += GRAVITY;
            bird.y += bird.velocity;
            
            // Limite do chão e teto
            if (bird.y + bird.radius >= canvas.height - 20) {
                gameOver = true;
                bird.y = canvas.height - 20 - bird.radius;
            }
            if (bird.y - bird.radius <= 0) {
                gameOver = true;
                bird.y = bird.radius;
            }
            
            // Gera novos canos
            if (frameCount % 90 === 0) { // Intervalo maior entre canos
                pipes.push(new Pipe());
            }
            
            // Atualiza e verifica canos
            pipes = pipes.filter(pipe => {
                pipe.update();
                
                // Verifica colisão
                if (pipe.checkCollision(bird)) {
                    gameOver = true;
                }
                
                // Marca ponto quando passa pelo cano
                if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
                    pipe.passed = true;
                    score++;
                    scoreDisplay.textContent = score;
                    
                    // Atualiza best score
                    if (score > bestScore) {
                        bestScore = score;
                        bestScoreDisplay.textContent = bestScore;
                        localStorage.setItem('flappyBest', bestScore);
                    }
                }
                
                return pipe.x + PIPE_WIDTH > 0;
            });
        }
        
        // ===== DESENHA TUDO =====
        function draw() {
            drawBackground();
            
            // Desenha canos
            pipes.forEach(pipe => pipe.draw());
            
            // Desenha pássaro
            drawBird();
            
            // Tela de início
            if (!gameStarted && !gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('CLIQUE PARA COMEÇAR', canvas.width / 2, canvas.height / 2);
                ctx.font = '16px Arial';
                ctx.fillStyle = '#ccc';
                ctx.fillText('Pule entre os canos!', canvas.width / 2, canvas.height / 2 + 40);
            }
            
            // Tela de Game Over
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.fillStyle = '#ffd700';
                ctx.font = '20px Arial';
                ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 20);
                
                if (score === bestScore && score > 0) {
                    ctx.fillStyle = '#00ff88';
                    ctx.fillText('🏆 NOVO RECORDE! 🏆', canvas.width / 2, canvas.height / 2 + 55);
                }
                
                ctx.fillStyle = '#ccc';
                ctx.font = '16px Arial';
                ctx.fillText('Clique ou pressione R para reiniciar', canvas.width / 2, canvas.height / 2 + 90);
            }
            
            // Score durante o jogo
            if (gameStarted && !gameOver) {
                ctx.fillStyle = '#1a1a1a';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(score, canvas.width / 2, 50);
                ctx.fillStyle = '#00ff88';
                ctx.fillText(score, canvas.width / 2 - 2, 48);
            }
        }
        
        // ===== LOOP PRINCIPAL =====
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // ===== REINICIA O JOGO =====
        function restart() {
            bird = {
                y: 300,
                velocity: 0,
                radius: 12,
                x: 70
            };
            pipes = [];
            score = 0;
            gameOver = false;
            gameStarted = false;
            frameCount = 0;
            scoreDisplay.textContent = '0';
        }
        
        // ===== CONTROLES =====
        function jump() {
            if (!gameStarted && !gameOver) {
                gameStarted = true;
            }
            if (!gameOver) {
                bird.velocity = JUMP_FORCE;
            }
        }
        
        // Event listeners
        canvas.addEventListener('click', () => {
            if (gameOver) {
                restart();
            } else {
                jump();
            }
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameOver) {
                    restart();
                } else {
                    jump();
                }
            }
            if (e.code === 'KeyR') {
                restart();
            }
        });
        
        document.getElementById('restartBtn').addEventListener('click', restart);
        
        // Previne scroll com espaço
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
                e.preventDefault();
            }
        }, false);
        
        // Inicializa posição do pássaro
        bird.x = 70;
        
        // Inicia o jogo
        gameLoop();
    </script>
</body>
</html>
