<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colheita Feliz | AGRO+VERDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --verde-neon: #00ff88;
            --fundo: #050a05;
            --texto: #e0ffe0;
            --dourado: #ffd700;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Archivo', sans-serif;
            background: linear-gradient(135deg, #0a1a0a, #020502);
            color: var(--texto);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .game-wrapper {
            max-width: 900px;
            width: 100%;
            background: rgba(0, 255, 136, 0.03);
            backdrop-filter: blur(15px);
            border: 2px solid var(--verde-neon);
            border-radius: 40px;
            padding: 30px;
        }
        h1 {
            font-family: 'Clash Display', sans-serif;
            text-align: center;
            margin-bottom: 20px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 60px;
        }
        .stat {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stat i { color: var(--dourado); font-size: 1.5rem; }
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .plot {
            aspect-ratio: 1;
            background: #1a3a1a;
            border: 2px solid #2a5a2a;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 2.5rem;
        }
        .plot:hover { border-color: var(--verde-neon); }
        .plot.planted { background: #2a5a2a; }
        .plot.ready { background: #3a7a3a; border-color: var(--dourado); animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 10px var(--dourado); }
            50% { box-shadow: 0 0 30px var(--dourado); }
        }
        .growth-bar {
            width: 80%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            margin-top: 8px;
        }
        .growth-fill {
            height: 100%;
            background: var(--verde-neon);
            border-radius: 3px;
            width: 0%;
        }
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: var(--verde-neon); color: #000; }
        .btn-warning { background: var(--dourado); color: #000; }
        .btn-secondary { background: transparent; border: 1px solid var(--verde-neon); color: var(--verde-neon); }
        .truck-area {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--texto);
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <h1><i class="fas fa-tractor"></i> COLHEITA FELIZ</h1>
        
        <div class="stats">
            <div class="stat"><i class="fas fa-coins"></i> <span id="money">💰 100</span></div>
            <div class="stat"><i class="fas fa-seedling"></i> <span id="seeds">🌱 5</span></div>
            <div class="stat"><i class="fas fa-apple-alt"></i> <span id="harvest">🌽 0</span></div>
        </div>
        
        <div class="farm-grid" id="farmGrid"></div>
        
        <div class="buttons">
            <button class="btn btn-primary" id="buySeedBtn"><i class="fas fa-shopping-cart"></i> Comprar Semente (30💰)</button>
            <button class="btn btn-warning" id="loadTruckBtn"><i class="fas fa-truck-loading"></i> Carregar Caminhão</button>
        </div>
        
        <div class="truck-area">
            <span><i class="fas fa-truck"></i> Caminhão: <span id="truckLoad">0/10</span></span>
            <button class="btn btn-secondary" id="deliverBtn"><i class="fas fa-city"></i> Entregar (50💰/un)</button>
        </div>
        
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
    </div>

    <script>
        let money = 100, seeds = 5, harvested = 0, truckLoad = 0;
        const plots = [
            { planted: false, growth: 0, ready: false },
            { planted: false, growth: 0, ready: false },
            { planted: false, growth: 0, ready: false },
            { planted: false, growth: 0, ready: false },
            { planted: false, growth: 0, ready: false },
            { planted: false, growth: 0, ready: false }
        ];
        
        function renderFarm() {
            const grid = document.getElementById('farmGrid');
            grid.innerHTML = plots.map((plot, i) => {
                let emoji = '🟫';
                let growthBar = '';
                if (plot.ready) emoji = '🌽';
                else if (plot.planted) {
                    emoji = plot.growth < 33 ? '🌱' : plot.growth < 66 ? '🌿' : '🌾';
                    growthBar = `<div class="growth-bar"><div class="growth-fill" style="width:${plot.growth}%"></div></div>`;
                }
                return `<div class="plot ${plot.planted ? 'planted' : ''} ${plot.ready ? 'ready' : ''}" onclick="handlePlot(${i})">${emoji}${growthBar}</div>`;
            }).join('');
        }
        
        function updateUI() {
            document.getElementById('money').textContent = `💰 ${money}`;
            document.getElementById('seeds').textContent = `🌱 ${seeds}`;
            document.getElementById('harvest').textContent = `🌽 ${harvested}`;
            document.getElementById('truckLoad').textContent = `${truckLoad}/10`;
        }
        
        function handlePlot(i) {
            const plot = plots[i];
            if (plot.ready) {
                harvested += 1;
                plot.planted = plot.ready = false;
                plot.growth = 0;
                renderFarm();
                updateUI();
            } else if (!plot.planted && seeds > 0) {
                seeds--;
                plot.planted = true;
                plot.growth = 0;
                renderFarm();
                updateUI();
            } else if (plot.planted && !plot.ready) {
                alert(`🌱 Crescimento: ${Math.round(plot.growth)}%`);
            } else if (seeds <= 0) {
                alert('❌ Sem sementes! Compre mais.');
            }
        }
        
        setInterval(() => {
            plots.forEach(p => {
                if (p.planted && !p.ready) {
                    p.growth = Math.min(100, p.growth + 3);
                    if (p.growth >= 100) p.ready = true;
                }
            });
            renderFarm();
        }, 1000);
        
        document.getElementById('buySeedBtn').addEventListener('click', () => {
            if (money >= 30) {
                money -= 30;
                seeds += 3;
                updateUI();
            } else alert('❌ Dinheiro insuficiente!');
        });
        
        document.getElementById('loadTruckBtn').addEventListener('click', () => {
            if (harvested <= 0) return alert('❌ Nada para carregar!');
            const space = 10 - truckLoad;
            const load = Math.min(harvested, space);
            if (load <= 0) return alert('❌ Caminhão cheio!');
            harvested -= load;
            truckLoad += load;
            updateUI();
        });
        
        document.getElementById('deliverBtn').addEventListener('click', () => {
            if (truckLoad <= 0) return alert('❌ Caminhão vazio!');
            money += truckLoad * 50;
            truckLoad = 0;
            updateUI();
            alert(`🏆 Entrega realizada! +${truckLoad * 50}💰`);
        });
        
        renderFarm();
        updateUI();
    </script>
</body>
</html>
