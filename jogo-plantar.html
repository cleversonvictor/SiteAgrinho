<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
    <title>🧟 Plants vs Zombies | AGRO+VERDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-claro: #90EE90; --verde-escuro: #228B22; --marrom: #8B4513;
            --cinza: #696969; --azul-agua: #4FC3F7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Archivo', sans-serif; background: #1a1a2e;
            display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 10px;
        }
        .game-container {
            background: #0a0a1a; border: 4px solid #228B22; border-radius: 20px; padding: 15px;
            box-shadow: 0 0 60px rgba(34,139,34,0.4), inset 0 0 30px rgba(0,0,0,0.5);
            max-width: 1050px; width: 100%;
        }
        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; flex-wrap: wrap; gap: 10px;
        }
        .game-title {
            font-family: 'Clash Display', sans-serif; font-size: 1.8rem;
            color: #FFD700; text-shadow: 0 0 20px #FFD700;
            display: flex; align-items: center; gap: 10px;
        }
        .game-stats { display: flex; gap: 12px; flex-wrap: wrap; }
        .stat {
            display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.5);
            padding: 8px 14px; border-radius: 30px; border: 2px solid #228B22;
            color: #fff; font-weight: 600; font-size: 0.9rem;
        }
        .stat i { color: #FFD700; }
        .game-layout { display: grid; grid-template-columns: 1fr 200px; gap: 12px; }
        .battlefield {
            background: #2d5a1e; border-radius: 15px; padding: 8px;
            border: 3px solid #1a3d0f; box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
        }
        #gameCanvas { display: block; width: 100%; height: auto; border-radius: 8px; cursor: crosshair; }
        .side-panel { display: flex; flex-direction: column; gap: 10px; }
        .panel {
            background: rgba(0,0,0,0.4); border-radius: 15px; padding: 10px;
            border: 2px solid #228B22;
        }
        .panel-title {
            color: #FFD700; font-weight: 700; margin-bottom: 8px;
            display: flex; align-items: center; gap: 8px; font-size: 0.85rem;
        }
        .plants-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
        .plant-card {
            background: rgba(0,0,0,0.4); border-radius: 10px; padding: 8px 4px;
            text-align: center; cursor: pointer; border: 2px solid transparent;
            transition: all 0.2s; font-size: 0.7rem;
        }
        .plant-card:hover { border-color: #FFD700; transform: scale(1.05); }
        .plant-card.selected { border-color: #FFD700; box-shadow: 0 0 12px rgba(255,215,0,0.5); background: rgba(255,215,0,0.1); }
        .plant-card.on-cooldown { opacity: 0.5; cursor: not-allowed; }
        .plant-emoji { font-size: 1.6rem; }
        .plant-name { font-weight: 600; color: #fff; }
        .plant-cost { color: #FFD700; font-size: 0.65rem; }
        .phase-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .phase-btn {
            aspect-ratio: 1; background: rgba(0,0,0,0.4); border: 2px solid #555;
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 0.8rem; font-weight: 700; color: #aaa; transition: all 0.2s;
        }
        .phase-btn.unlocked { border-color: #FFD700; color: #FFD700; }
        .phase-btn.completed { background: #228B22; border-color: #90EE90; color: #fff; }
        .phase-btn:hover { transform: scale(1.1); }
        .btn {
            padding: 10px 14px; border-radius: 25px; font-weight: 700; border: none;
            cursor: pointer; font-size: 0.8rem; transition: all 0.2s;
            font-family: 'Archivo', sans-serif; width: 100%;
        }
        .btn-start { background: #228B22; color: #fff; }
        .btn-start:hover { background: #2d8a2d; transform: scale(1.03); }
        .btn-reset { background: #c0392b; color: #fff; margin-top: 4px; }
        .btn-reset:hover { background: #e74c3c; }
        .info-text { color: #ccc; font-size: 0.75rem; margin-bottom: 6px; }
        .back-link { display: block; text-align: center; margin-top: 8px; color: #aaa; text-decoration: none; font-size: 0.8rem; }
        .back-link:hover { color: #FFD700; }

        @media (max-width: 768px) {
            .game-layout { grid-template-columns: 1fr; }
            .game-title { font-size: 1.3rem; }
            .plants-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="game-title">🧟 PLANTS VS ZOMBIES 🌱</div>
        <div class="game-stats">
            <div class="stat"><i class="fas fa-sun"></i> <span id="sunDisplay">150</span></div>
            <div class="stat"><i class="fas fa-flag"></i> Fase <span id="phaseDisplay">1</span></div>
            <div class="stat"><i class="fas fa-skull"></i> Onda <span id="waveDisplay">0</span>/<span id="totalWavesDisplay">3</span></div>
        </div>
    </div>

    <div class="game-layout">
        <div class="battlefield">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
        </div>

        <div class="side-panel">
            <div class="panel">
                <div class="panel-title"><i class="fas fa-seedling"></i> PLANTAS</div>
                <div class="plants-grid" id="plantsGrid"></div>
            </div>
            <div class="panel">
                <div class="panel-title"><i class="fas fa-map"></i> FASES</div>
                <div class="phase-grid" id="phaseGrid"></div>
            </div>
            <div class="panel">
                <div class="panel-title"><i class="fas fa-info-circle"></i> INFORMAÇÕES</div>
                <p class="info-text">🧟 Zumbis vivos: <span id="zombiesAlive">0</span></p>
                <p class="info-text">💀 Zumbis mortos: <span id="zombiesDead">0</span></p>
                <p class="info-text">🌱 Plantas: <span id="plantsActive">0</span></p>
                <p class="info-text">🚜 Cortadores: <span id="mowersActive">5</span></p>
                <button class="btn btn-start" id="startWaveBtn">▶ INICIAR ONDA</button>
                <button class="btn btn-reset" id="resetBtn">↺ REINICIAR FASE</button>
            </div>
        </div>
    </div>
    <a href="index.html" class="back-link">⬅ Voltar ao site</a>
</div>

<script>
// ===== VALORES EXATOS DO JOGO ORIGINAL =====
const DANO_ERVILHA = 20;
const SOL_VALOR = 25;
const FPS = 60;

// ===== PLANTAS (VALORES EXATOS) =====
const PLANTS = {
    sunflower: {
        name:'Girassol', emoji:'🌻', cost:50, hp:300, cooldown:450,
        sunInterval:1440, desc:'Gera 1 Sol (+25) a cada 24s'
    },
    peashooter: {
        name:'Disparervilha', emoji:'🌱', cost:100, hp:300, cooldown:450,
        shootInterval:90, damage:DANO_ERVILHA, desc:'Atira 1 ervilha (20 dano) a cada 1.5s'
    },
    snowpea: {
        name:'Gelervilha', emoji:'❄️', cost:175, hp:300, cooldown:450,
        shootInterval:90, damage:DANO_ERVILHA, slow:true, desc:'Ervilha de gelo. Reduz velocidade em 50%'
    },
    repeater: {
        name:'Repetidora', emoji:'🌿', cost:200, hp:300, cooldown:450,
        shootInterval:90, damage:DANO_ERVILHA, doubleShot:true, desc:'Atira 2 ervilhas a cada 1.5s'
    },
    wallnut: {
        name:'Noz-Obstáculo', emoji:'🥜', cost:50, hp:4000, cooldown:1800,
        desc:'Bloqueia zumbis (4000 HP)'
    },
    tallnut: {
        name:'Noz-Gigante', emoji:'🧱', cost:125, hp:8000, cooldown:1800,
        desc:'Muralha de 8000 HP'
    },
    cherrybomb: {
        name:'Cerejas-Bomba', emoji:'🍒', cost:150, hp:9999, cooldown:3000,
        damage:1800, radius:2, desc:'Explode em área 3x3 (1800 dano)'
    },
    potatomine: {
        name:'Batatamina', emoji:'🥔', cost:25, hp:300, cooldown:1800,
        armTime:900, damage:1800, desc:'Arma em 15s. Explode com 1800 de dano'
    },
    squash: {
        name:'Esmagadora', emoji:'🎃', cost:50, hp:300, cooldown:1800,
        damage:1800, range:45, desc:'Esmaga 1 zumbi próximo'
    },
    jalapeno: {
        name:'Pimenta', emoji:'🌶️', cost:125, hp:1, cooldown:3000,
        damage:9999, rowBomb:true, desc:'Destrói TODA uma fileira'
    }
};

// ===== ZUMBIS (VALORES EXATOS) =====
const ZOMBIES = {
    basic: { name:'Zumbi Comum', emoji:'🧟', hp:270, speed:0.22, damage:20, reward:10 },
    cone: { name:'Zumbi do Cone', emoji:'⛑️', hp:640, speed:0.22, damage:20, reward:15, shieldHp:370 },
    bucket: { name:'Zumbi do Balde', emoji:'🪖', hp:1370, speed:0.22, damage:20, reward:20, shieldHp:1100 },
    pole: { name:'Zumbi com Vara', emoji:'🏃', hp:500, speed:0.55, damage:20, reward:18, canJump:true },
    football: { name:'Zumbi de Futebol', emoji:'🏈', hp:1670, speed:0.45, damage:40, reward:25, shieldHp:800, fastEat:true }
};

// ===== FASES COM ONDAS =====
const PHASES = [
    { name:'Jardim Dia', rows:5, bg:'#4a8a2e', sunFall:true, waves:[
        { zombies:[{type:'basic',count:3}] },
        { zombies:[{type:'basic',count:5}] },
        { zombies:[{type:'basic',count:4},{type:'cone',count:2}] }
    ]},
    { name:'Jardim Dia+', rows:5, bg:'#4a8a2e', sunFall:true, waves:[
        { zombies:[{type:'basic',count:5},{type:'cone',count:3}] },
        { zombies:[{type:'basic',count:4},{type:'cone',count:4}] },
        { zombies:[{type:'cone',count:5},{type:'pole',count:2}] }
    ]},
    { name:'Noite', rows:5, bg:'#1a2a3e', sunFall:false, waves:[
        { zombies:[{type:'basic',count:6},{type:'cone',count:4}] },
        { zombies:[{type:'cone',count:6},{type:'pole',count:3}] },
        { zombies:[{type:'cone',count:4},{type:'bucket',count:3},{type:'pole',count:3}] }
    ]},
    { name:'Piscina Dia', rows:6, bg:'#3a6a8e', sunFall:true, water:true, waves:[
        { zombies:[{type:'basic',count:8},{type:'cone',count:5}] },
        { zombies:[{type:'cone',count:6},{type:'pole',count:4},{type:'bucket',count:2}] },
        { zombies:[{type:'bucket',count:4},{type:'football',count:3},{type:'pole',count:4}] }
    ]},
    { name:'Telhado', rows:5, bg:'#5a3a2e', sunFall:true, roof:true, waves:[
        { zombies:[{type:'basic',count:10},{type:'cone',count:6},{type:'bucket',count:3}] },
        { zombies:[{type:'cone',count:8},{type:'bucket',count:5},{type:'football',count:3}] },
        { zombies:[{type:'bucket',count:6},{type:'football',count:5},{type:'pole',count:5}] }
    ]}
];

// ===== ESTADO DO JOGO =====
let sun = 150, currentPhase = 0, currentWave = 0, totalWaves = 3;
let plants = [], zombies = [], projectiles = [], particles = [], suns = [], lawnmowers = [];
let selectedPlant = 'peashooter';
let waveActive = false, gameOver = false, victory = false, phaseComplete = false;
let zombiesKilled = 0, frameCount = 0, totalFrameCount = 0;
let cooldowns = {};
let phase = PHASES[0];
let zombiesToSpawn = [];

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const COLS = 9, START_X = 60, START_Y = 30;
let CELL_W = 80, CELL_H = 90, ROWS = 5;

// ===== INICIALIZAÇÃO =====
function init() {
    updateDimensions();
    renderPlants();
    renderPhases();
    loadPhase(0);
    gameLoop();
}

function updateDimensions() {
    ROWS = phase.rows;
    CELL_H = ROWS === 6 ? 75 : 90;
}

function renderPlants() {
    const grid = document.getElementById('plantsGrid');
    grid.innerHTML = '';
    Object.entries(PLANTS).forEach(([key, p]) => {
        const onCd = cooldowns[key] && cooldowns[key] > 0;
        const card = document.createElement('div');
        card.className = `plant-card ${selectedPlant === key ? 'selected' : ''} ${onCd ? 'on-cooldown' : ''}`;
        card.innerHTML = `<div class="plant-emoji">${p.emoji}</div><div class="plant-name">${p.name}</div><div class="plant-cost">☀️${p.cost}</div>`;
        card.title = p.desc;
        card.addEventListener('click', () => { if (!onCd) { selectedPlant = key; renderPlants(); } });
        grid.appendChild(card);
    });
}

function renderPhases() {
    const grid = document.getElementById('phaseGrid');
    grid.innerHTML = '';
    PHASES.forEach((p, i) => {
        const btn = document.createElement('div');
        btn.className = 'phase-btn unlocked';
        btn.textContent = i + 1;
        btn.title = p.name;
        btn.addEventListener('click', () => { if (!waveActive || phaseComplete) loadPhase(i); });
        grid.appendChild(btn);
    });
}

function loadPhase(index) {
    currentPhase = index;
    phase = PHASES[index];
    totalWaves = phase.waves.length;
    currentWave = 0;
    plants = []; zombies = []; projectiles = []; particles = []; suns = [];
    waveActive = false; gameOver = false; victory = false; phaseComplete = false;
    zombiesKilled = 0; frameCount = 0;
    sun = phase.sunFall ? 150 : 100;
    cooldowns = {};
    updateDimensions();
    lawnmowers = [];
    for (let i = 0; i < ROWS; i++) lawnmowers.push({ active:true, row:i });
    zombiesToSpawn = [];
    updateUI();
}

function startWave() {
    if (waveActive || gameOver || phaseComplete) return;
    if (currentWave >= totalWaves) return;
    
    waveActive = true;
    frameCount = 0;
    const waveData = phase.waves[currentWave];
    zombiesToSpawn = [];
    
    waveData.zombies.forEach(group => {
        for (let i = 0; i < group.count; i++) {
            zombiesToSpawn.push({ type: group.type, spawned: false, delay: i * 400 + Math.random() * 300 });
        }
    });
    
    updateUI();
}

function update() {
    totalFrameCount++;
    
    // Cooldowns
    Object.keys(cooldowns).forEach(k => { if (cooldowns[k] > 0) cooldowns[k]--; });
    if (totalFrameCount % 30 === 0) renderPlants();
    
    // Sol natural (a cada 10s)
    if (phase.sunFall && totalFrameCount % 600 === 0 && sun < 300) {
        suns.push({ x: Math.random() * 600 + 80, y: -20, collected:false, timer:480 });
    }
    
    // Produção de sol do girassol (a cada 24s)
    plants.forEach(p => {
        if (p.type === 'sunflower') {
            p.sunTimer = (p.sunTimer || 0) + 1;
            if (p.sunTimer >= PLANTS.sunflower.sunInterval) {
                p.sunTimer = 0;
                sun += SOL_VALOR;
                suns.push({ x: p.x + (Math.random()-0.5)*40, y: p.y - 15, collected:false, timer:480 });
            }
        }
    });
    
    // Sóis caem
    suns = suns.filter(s => {
        if (!s.collected) { s.y += 1; s.timer--; return s.timer > 0 && s.y < 520; }
        return false;
    });
    
    if (!waveActive || gameOver || phaseComplete) { updateUI(); return; }
    
    frameCount++;
    
    // Spawn de zumbis
    zombiesToSpawn.forEach(zs => {
        if (!zs.spawned && frameCount * 16.67 >= zs.delay) {
            zs.spawned = true;
            const zd = ZOMBIES[zs.type];
            const row = Math.floor(Math.random() * ROWS);
            zombies.push({
                type: zs.type, row,
                x: 820, y: START_Y + row * CELL_H + CELL_H/2,
                hp: zd.hp, maxHp: zd.hp,
                shieldHp: zd.shieldHp || 0, maxShieldHp: zd.shieldHp || 0,
                speed: zd.speed, damage: zd.damage,
                reward: zd.reward, emoji: zd.emoji,
                canJump: zd.canJump || false, hasJumped: false,
                fastEat: zd.fastEat || false,
                frozen: false, frozenTimer: 0, biteTimer: 0
            });
        }
    });
    
    // Ataque das plantas
    plants.forEach(p => {
        // Cereja bomba
        if (p.type === 'cherrybomb') {
            p.detonateTimer = (p.detonateTimer || 72) - 1;
            if (p.detonateTimer <= 0 && !p.exploded) {
                p.exploded = true;
                for (let i = 0; i < 40; i++) {
                    particles.push({ x:p.x, y:p.y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:25, color:'#ff0000' });
                }
                zombies.forEach(z => {
                    if (Math.abs(z.x - p.x) < CELL_W*2 && Math.abs(z.y - p.y) < CELL_H*2) {
                        z.hp -= PLANTS.cherrybomb.damage;
                    }
                });
                p.hp = 0;
            }
            return;
        }
        
        // Pimenta
        if (p.type === 'jalapeno') {
            for (let i = 0; i < 50; i++) {
                particles.push({ x:Math.random()*700+50, y:START_Y+p.row*CELL_H+Math.random()*CELL_H, vx:0, vy:-3, life:20, color:'#ff4400' });
            }
            zombies.forEach(z => { if (z.row === p.row) z.hp = 0; });
            p.hp = 0;
            return;
        }
        
        // Atiradoras
        if (['peashooter','snowpea','repeater'].includes(p.type)) {
            const hasZombie = zombies.some(z => z.row === p.row && z.x > p.x);
            if (hasZombie) {
                p.shootTimer = (p.shootTimer || 0) + 1;
                if (p.shootTimer >= PLANTS[p.type].shootInterval) {
                    p.shootTimer = 0;
                    const plant = PLANTS[p.type];
                    projectiles.push({ x:p.x+20, y:p.y-5, row:p.row, damage:plant.damage, slow:plant.slow||false });
                    if (plant.doubleShot) {
                        setTimeout(() => projectiles.push({ x:p.x+20, y:p.y-2, row:p.row, damage:plant.damage, slow:false }), 100);
                    }
                }
            }
        }
        
        // Batatamina
        if (p.type === 'potatomine' && !p.armed) {
            p.armTimer = (p.armTimer || 0) + 1;
            if (p.armTimer >= PLANTS.potatomine.armTime) p.armed = true;
        }
        
        // Esmagadora
        if (p.type === 'squash') {
            const z = zombies.find(z => z.row === p.row && Math.abs(z.x - p.x) < PLANTS.squash.range);
            if (z) { z.hp -= PLANTS.squash.damage; p.hp = 0; }
        }
    });
    
    // Projéteis
    projectiles = projectiles.filter(proj => {
        proj.x += 5;
        let hit = false;
        zombies.forEach(z => {
            if (!hit && z.row === proj.row && Math.abs(z.x - proj.x) < 22 && z.hp > 0) {
                if (z.shieldHp > 0) {
                    z.shieldHp -= proj.damage;
                    if (z.shieldHp < 0) { z.hp += z.shieldHp; z.shieldHp = 0; }
                } else {
                    z.hp -= proj.damage;
                }
                hit = true;
                if (proj.slow) { z.frozen = true; z.frozenTimer = 600; }
                particles.push({ x:proj.x, y:proj.y, vx:0, vy:0, life:6, color:'#ffff00' });
            }
        });
        return !hit && proj.x < 850;
    });
    
    // Zumbis
    zombies.forEach(z => {
        if (z.frozen) { z.frozenTimer--; if (z.frozenTimer <= 0) z.frozen = false; }
        const speed = z.frozen ? z.speed * 0.5 : z.speed;
        z.x -= speed;
        z.biteTimer++;
        
        // Batatamina explode
        plants.forEach(p => {
            if (p.type === 'potatomine' && p.armed && z.row === p.row && Math.abs(z.x - p.x) < 30) {
                for (let i = 0; i < 30; i++) {
                    particles.push({ x:p.x, y:p.y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, life:15, color:'#ff8800' });
                }
                z.hp -= PLANTS.potatomine.damage;
                p.hp = 0;
            }
        });
        
        // Mordida (a cada 30 frames = 0.5s)
        if (z.biteTimer >= 30) {
            z.biteTimer = 0;
            const plant = plants.find(p => p.row === z.row && Math.abs(z.x - p.x) < 25 && p.hp > 0 && p.type !== 'cherrybomb');
            if (plant) {
                plant.hp -= z.damage;
                if (z.canJump && !z.hasJumped) { z.hasJumped = true; z.x += CELL_W; z.speed = 0.22; }
            }
        }
        
        // Cortador de grama
        if (z.x < 35 && z.row < lawnmowers.length && lawnmowers[z.row].active) {
            lawnmowers[z.row].active = false;
            zombies.forEach(zz => { if (zz.row === z.row && zz.x < 500) zz.hp = 0; });
        }
        
        if (z.x < 10) gameOver = true;
    });
    
    zombies = zombies.filter(z => z.hp > 0 && z.x >= 10);
    plants = plants.filter(p => p.hp > 0);
    particles = particles.filter(p => { p.x += p.vx; p.y += p.vy; p.life--; return p.life > 0; });
    
    // Verifica fim da onda
    if (zombies.length === 0 && zombiesToSpawn.every(zs => zs.spawned) && frameCount > 120) {
        waveActive = false;
        currentWave++;
        if (currentWave >= totalWaves) {
            phaseComplete = true;
            victory = true;
        }
    }
    
    updateUI();
}

function draw() {
    ctx.fillStyle = phase.bg;
    ctx.fillRect(0, 0, 800, 500);
    
    // Gramado xadrez
    for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
            const x = START_X + col * CELL_W;
            const y = START_Y + row * CELL_H;
            ctx.fillStyle = (row + col) % 2 === 0 ? 'rgba(144,238,144,0.2)' : 'rgba(34,139,34,0.12)';
            if (phase.water && (row === 2 || row === 3)) {
                ctx.fillStyle = (row + col) % 2 === 0 ? 'rgba(79,195,247,0.25)' : 'rgba(79,195,247,0.15)';
            }
            ctx.fillRect(x, y, CELL_W, CELL_H);
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.strokeRect(x, y, CELL_W, CELL_H);
        }
    }
    
    // Casa
    ctx.fillStyle = '#6B3A2E'; ctx.fillRect(5, START_Y-5, 40, ROWS*CELL_H+10);
    ctx.fillStyle = '#8B5A3E'; ctx.fillRect(0, START_Y-18, 50, 30);
    
    // Cortadores
    lawnmowers.forEach((lm, i) => {
        if (lm.active) { ctx.font = '16px Arial'; ctx.fillText('🚜', lm.active ? 15 : 800, START_Y + i*CELL_H + CELL_H/2 + 8); }
    });
    
    // Plantas
    plants.forEach(p => {
        if (p.type === 'cherrybomb' && !p.exploded) {
            ctx.fillStyle = 'rgba(255,0,0,0.3)';
            ctx.beginPath(); ctx.arc(p.x, p.y, 30 + (72 - (p.detonateTimer||72))/2, 0, Math.PI*2); ctx.fill();
        }
        ctx.font = '30px Arial'; ctx.textAlign = 'center';
        ctx.fillText(PLANTS[p.type].emoji, p.x, p.y + 10);
        
        if (p.hp < p.maxHp && p.type !== 'cherrybomb' && p.type !== 'jalapeno') {
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(p.x-22, p.y-35, 44, 6);
            const hpPct = p.hp / p.maxHp;
            ctx.fillStyle = hpPct > 0.5 ? '#00ff00' : hpPct > 0.25 ? '#ffd700' : '#ff0000';
            ctx.fillRect(p.x-22, p.y-35, 44*hpPct, 6);
        }
        
        if (p.type === 'wallnut') {
            if (p.hp < 1333) ctx.fillText('💔', p.x, p.y-20);
            else if (p.hp < 2666) ctx.fillText('💛', p.x, p.y-20);
        }
        if (p.type === 'tallnut') {
            if (p.hp < 2666) ctx.fillText('💔', p.x, p.y-25);
            else if (p.hp < 5333) ctx.fillText('💛', p.x, p.y-25);
        }
        if (p.type === 'potatomine' && !p.armed) {
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, Math.PI*2); ctx.fill();
        }
    });
    
    // Zumbis
    zombies.forEach(z => {
        if (z.frozen) { ctx.fillStyle = 'rgba(79,195,247,0.3)'; ctx.fillRect(z.x-20, z.y-25, 40, 50); }
        ctx.font = '34px Arial'; ctx.fillText(z.emoji, z.x, z.y);
        
        if (z.shieldHp > 0) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(z.x-22, z.y-42, 44, 5);
            ctx.fillStyle = '#888'; ctx.fillRect(z.x-22, z.y-42, 44*(z.shieldHp/z.maxShieldHp), 5);
        }
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(z.x-22, z.y-35, 44, 5);
        ctx.fillStyle = '#ff0000'; ctx.fillRect(z.x-22, z.y-35, 44*(z.hp/z.maxHp), 5);
    });
    
    // Projéteis
    projectiles.forEach(p => {
        ctx.fillStyle = p.slow ? '#4fc3f7' : '#00ff00';
        ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill();
    });
    
    // Sóis
    suns.forEach(s => {
        if (!s.collected) {
            ctx.fillStyle = '#FFD700'; ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(s.x, s.y, 14, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
    });
    
    // Partículas
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
    });
    
    // Overlays
    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, 800, 500);
        ctx.fillStyle = '#ff0000'; ctx.font = 'bold 40px Clash Display'; ctx.textAlign = 'center';
        ctx.fillText('💀 OS ZUMBIS COMERAM', 400, 230);
        ctx.fillText('SEU CÉREBRO! 💀', 400, 280);
    }
    if (phaseComplete && !gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, 800, 500);
        ctx.fillStyle = '#FFD700'; ctx.font = 'bold 40px Clash Display'; ctx.textAlign = 'center';
        ctx.fillText('🏆 FASE COMPLETA! 🏆', 400, 230);
        ctx.fillStyle = '#00ff88'; ctx.font = '20px Archivo';
        ctx.fillText('Clique em INICIAR ONDA para a próxima fase', 400, 280);
    }
    
    ctx.textAlign = 'start';
}

function updateUI() {
    document.getElementById('sunDisplay').textContent = Math.floor(sun);
    document.getElementById('phaseDisplay').textContent = currentPhase + 1;
    document.getElementById('waveDisplay').textContent = currentWave;
    document.getElementById('totalWavesDisplay').textContent = totalWaves;
    document.getElementById('zombiesAlive').textContent = zombies.length;
    document.getElementById('zombiesDead').textContent = zombiesKilled;
    document.getElementById('plantsActive').textContent = plants.length;
    document.getElementById('mowersActive').textContent = lawnmowers.filter(lm => lm.active).length;
    
    zombiesKilled = zombies.filter(z => z.hp <= 0).length + 
        (zombiesKilled - zombies.filter(z => z.hp > 0).length);
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

// ===== EVENTOS =====
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    
    suns.forEach(s => {
        if (!s.collected && Math.abs(mx - s.x) < 22 && Math.abs(my - s.y) < 22) {
            s.collected = true; sun += SOL_VALOR;
        }
    });
    
    if (!waveActive && !gameOver && !phaseComplete) {
        const col = Math.floor((mx - START_X) / CELL_W);
        const row = Math.floor((my - START_Y) / CELL_H);
        if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
            const plant = PLANTS[selectedPlant];
            if (sun >= plant.cost && (!cooldowns[selectedPlant] || cooldowns[selectedPlant] <= 0)) {
                const x = START_X + col * CELL_W + CELL_W/2;
                const y = START_Y + row * CELL_H + CELL_H/2;
                if (!plants.some(p => Math.abs(p.x - x) < 30 && Math.abs(p.y - y) < 30)) {
                    sun -= plant.cost;
                    cooldowns[selectedPlant] = plant.cooldown;
                    
                    if (selectedPlant === 'cherrybomb') {
                        plants.push({ type:'cherrybomb', x, y, row, col, hp:9999, detonateTimer:72, exploded:false });
                    } else if (selectedPlant === 'jalapeno') {
                        const p = { type:'jalapeno', x, y, row, col, hp:1 };
                        plants.push(p);
                        setTimeout(() => {
                            for (let i = 0; i < 50; i++) {
                                particles.push({ x:Math.random()*700+50, y:START_Y+row*CELL_H+Math.random()*CELL_H, vx:0, vy:-3, life:20, color:'#ff4400' });
                            }
                            zombies.forEach(z => { if (z.row === row) z.hp = 0; });
                            plants = plants.filter(pp => pp !== p);
                        }, 500);
                    } else {
                        plants.push({ type:selectedPlant, col, row, x, y, hp:plant.hp, maxHp:plant.hp, armed:selectedPlant!=='potatomine', armTimer:0, shootTimer:0, sunTimer:0 });
                    }
                    renderPlants();
                }
            }
        }
    }
});

document.getElementById('startWaveBtn').addEventListener('click', () => {
    if (phaseComplete) {
        const nextPhase = currentPhase + 1;
        if (nextPhase < PHASES.length) {
            loadPhase(nextPhase);
        } else {
            loadPhase(0);
        }
    } else {
        startWave();
    }
});

document.getElementById('resetBtn').addEventListener('click', () => loadPhase(currentPhase));

init();
</script>
