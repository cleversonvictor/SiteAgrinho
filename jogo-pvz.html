<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
    <title>🌱 Plants vs Zombies | AGRO+VERDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --verde-neon: #00ff88;
            --verde-escuro: #0a1a0a;
            --verde-medio: #1a3a1a;
            --dourado: #ffd700;
            --roxo: #a855f7;
            --vermelho: #ff4444;
            --azul: #4fc3f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Archivo', sans-serif;
            background: linear-gradient(135deg, var(--verde-escuro) 0%, #020502 100%);
            color: #e0ffe0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(0, 255, 136, 0.03);
            backdrop-filter: blur(20px);
            border: 3px solid var(--verde-neon);
            border-radius: 40px;
            padding: 25px;
            box-shadow: 0 0 80px rgba(0, 255, 136, 0.3);
        }

        /* Header */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .game-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-title i {
            font-size: 2.5rem;
            color: var(--verde-neon);
            filter: drop-shadow(0 0 20px var(--verde-neon));
        }

        .game-title h1 {
            font-family: 'Clash Display', sans-serif;
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--verde-neon), var(--dourado));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .game-stats {
            display: flex;
            gap: 20px;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .stat-badge i {
            color: var(--dourado);
        }

        .stat-badge span {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dourado);
        }

        /* Área do jogo */
        .game-area {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }

        /* Canvas do jogo */
        .battlefield {
            background: linear-gradient(145deg, #2d5a1e, #1a3d0f);
            border-radius: 20px;
            padding: 15px;
            border: 2px solid rgba(0, 255, 136, 0.3);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 15px;
            cursor: crosshair;
        }

        /* Painel lateral */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Plantas disponíveis */
        .plants-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            color: var(--verde-neon);
            font-weight: 600;
        }

        .plants-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .plant-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
            position: relative;
        }

        .plant-card:hover {
            border-color: var(--verde-neon);
            transform: scale(1.05);
        }

        .plant-card.selected {
            border-color: var(--dourado);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .plant-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        .plant-emoji {
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .plant-name {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .plant-cost {
            font-size: 0.7rem;
            color: var(--dourado);
        }

        .plant-cooldown {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(0, 0, 0, 0.3);
        }

        .cooldown-fill {
            height: 100%;
            width: 0%;
            background: var(--dourado);
            transition: width 0.1s;
        }

        /* Wave info */
        .wave-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .wave-progress {
            margin: 10px 0;
        }

        .wave-bar {
            height: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }

        .wave-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--verde-neon), var(--dourado));
            border-radius: 10px;
            transition: width 0.3s;
        }

        .zombies-count {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 0.9rem;
        }

        /* Fases */
        .phases-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .phases-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .phase-btn {
            aspect-ratio: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 255, 136, 0.2);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            color: #e0ffe0;
            font-weight: 600;
        }

        .phase-btn:hover {
            border-color: var(--verde-neon);
            transform: scale(1.05);
        }

        .phase-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        .phase-btn.completed {
            border-color: var(--dourado);
        }

        .phase-stars {
            color: var(--dourado);
            font-size: 0.7rem;
        }

        /* Botões */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            font-size: 0.95rem;
            font-family: 'Archivo', sans-serif;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--verde-neon), #00cc6a);
            color: var(--verde-escuro);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--dourado), #ffaa00);
            color: var(--verde-escuro);
        }

        .btn-warning:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--vermelho), #cc0000);
            color: white;
        }

        /* Game Over / Victory */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: linear-gradient(135deg, #0a1a0a, #1a2a1a);
            border: 3px solid var(--verde-neon);
            border-radius: 40px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal-title {
            font-family: 'Clash Display', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .victory-title {
            color: var(--dourado);
        }

        .defeat-title {
            color: var(--vermelho);
        }

        .stars-earned {
            font-size: 2rem;
            margin: 20px 0;
        }

        /* Loja de upgrades */
        .shop-modal .plant-upgrade {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            margin-bottom: 10px;
        }

        .upgrade-btn {
            padding: 8px 16px;
            background: var(--dourado);
            color: var(--verde-escuro);
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Voltar */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--verde-neon);
        }

        /* Notificação */
        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 20, 10, 0.95);
            border: 2px solid var(--verde-neon);
            border-radius: 60px;
            padding: 16px 30px;
            z-index: 1001;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* Responsivo */
        @media (max-width: 900px) {
            .game-area {
                grid-template-columns: 1fr;
            }
            
            .phases-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 500px) {
            .game-container {
                padding: 15px;
            }
            
            .game-title h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <div class="game-header">
            <div class="game-title">
                <i class="fas fa-shield-alt"></i>
                <h1>PLANTS VS ZOMBIES</h1>
            </div>
            <div class="game-stats">
                <div class="stat-badge">
                    <i class="fas fa-sun"></i>
                    <span id="sunDisplay">50</span>
                </div>
                <div class="stat-badge">
                    <i class="fas fa-trophy"></i>
                    <span id="starsDisplay">0</span>
                </div>
            </div>
        </div>

        <!-- Área do jogo -->
        <div class="game-area">
            <!-- Campo de batalha -->
            <div class="battlefield">
                <canvas id="gameCanvas" width="800" height="500"></canvas>
            </div>

            <!-- Painel lateral -->
            <div class="side-panel">
                <!-- Plantas -->
                <div class="plants-panel">
                    <div class="panel-title">
                        <i class="fas fa-seedling"></i>
                        <span>PLANTAS</span>
                    </div>
                    <div class="plants-grid" id="plantsGrid"></div>
                </div>

                <!-- Wave info -->
                <div class="wave-info">
                    <div class="panel-title">
                        <i class="fas fa-skull"></i>
                        <span>ONDA <span id="waveNumber">1</span>/<span id="totalWaves">3</span></span>
                    </div>
                    <div class="wave-progress">
                        <div class="wave-bar">
                            <div class="wave-fill" id="waveFill" style="width: 0%"></div>
                        </div>
                        <div class="zombies-count">
                            <span>🧟 <span id="zombiesAlive">0</span></span>
                            <span>💀 <span id="zombiesKilled">0</span></span>
                        </div>
                    </div>
                </div>

                <!-- Fases -->
                <div class="phases-panel">
                    <div class="panel-title">
                        <i class="fas fa-map"></i>
                        <span>FASES</span>
                    </div>
                    <div class="phases-grid" id="phasesGrid"></div>
                </div>

                <!-- Botões -->
                <div class="action-buttons">
                    <button class="btn btn-primary" id="startWaveBtn">
                        <i class="fas fa-play"></i> Iniciar Onda
                    </button>
                    <button class="btn btn-warning" id="shopBtn">
                        <i class="fas fa-store"></i> Loja
                    </button>
                    <button class="btn btn-danger" id="resetBtn">
                        <i class="fas fa-rotate"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Voltar -->
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
    </div>

    <!-- Modal de Vitória/Derrota -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle"></div>
            <div class="stars-earned" id="starsEarned"></div>
            <p id="modalMessage"></p>
            <button class="btn btn-primary" id="modalContinue" style="margin-top: 20px;">Continuar</button>
        </div>
    </div>

    <!-- Modal da Loja -->
    <div class="modal-overlay" id="shopModal">
        <div class="modal-content" style="max-width: 500px;">
            <h2 class="modal-title" style="color: var(--dourado);"><i class="fas fa-store"></i> LOJA</h2>
            <div id="shopUpgrades"></div>
            <p style="margin: 20px 0;">⭐ Estrelas: <span id="shopStars">0</span></p>
            <button class="btn btn-warning" id="closeShop">FECHAR</button>
        </div>
    </div>

    <script>
        // ===== CONFIGURAÇÃO DAS PLANTAS =====
        const PLANTS = {
            sunflower: {
                name: 'Girassol',
                emoji: '🌻',
                cost: 50,
                health: 80,
                cooldown: 150,
                sunProduction: 25,
                upgradeLevel: 1
            },
            peashooter: {
                name: 'Ervilha',
                emoji: '🌱',
                cost: 100,
                health: 100,
                cooldown: 100,
                damage: 20,
                upgradeLevel: 1
            },
            wallnut: {
                name: 'Noz',
                emoji: '🥜',
                cost: 50,
                health: 400,
                cooldown: 200,
                upgradeLevel: 1
            },
            potato: {
                name: 'Batata',
                emoji: '🥔',
                cost: 25,
                health: 50,
                cooldown: 250,
                damage: 1800,
                explodeRadius: 60,
                upgradeLevel: 1
            },
            cherry: {
                name: 'Cereja',
                emoji: '🍒',
                cost: 150,
                health: 50,
                cooldown: 300,
                damage: 90,
                splashRadius: 80,
                upgradeLevel: 1
            }
        };

        // ===== CONFIGURAÇÃO DOS ZUMBIS =====
        const ZOMBIES = {
            basic: { name: 'Zumbi', emoji: '🧟', health: 100, speed: 0.8, damage: 10, reward: 10 },
            cone: { name: 'Capacete', emoji: '⛑️', health: 200, speed: 0.7, damage: 15, reward: 15 },
            fast: { name: 'Rápido', emoji: '🏃', health: 80, speed: 1.5, damage: 8, reward: 12 },
            giant: { name: 'Gigante', emoji: '👹', health: 500, speed: 0.4, damage: 30, reward: 30 },
            dancer: { name: 'Bailarina', emoji: '💃', health: 120, speed: 1.2, damage: 12, reward: 18 }
        };

        // ===== CONFIGURAÇÃO DAS FASES =====
        const PHASES = [
            { name: 'Dia', waves: 3, zombies: ['basic'], reward: 1 },
            { name: 'Noite', waves: 4, zombies: ['basic', 'cone'], reward: 2 },
            { name: 'Piscina', waves: 4, zombies: ['basic', 'cone', 'fast'], reward: 2 },
            { name: 'Telhado', waves: 5, zombies: ['basic', 'cone', 'fast', 'giant'], reward: 3 },
            { name: 'BOSS', waves: 1, zombies: ['giant', 'dancer'], reward: 5, boss: true }
        ];

        // ===== ESTADO DO JOGO =====
        class PlantsVsZombies {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.sun = 150;
                this.stars = parseInt(localStorage.getItem('pvzStars')) || 0;
                this.unlockedPhases = parseInt(localStorage.getItem('pvzPhases')) || 1;
                this.completedPhases = JSON.parse(localStorage.getItem('pvzCompleted')) || [];
                
                this.currentPhase = 0;
                this.currentWave = 0;
                this.waveInProgress = false;
                this.gameOver = false;
                this.victory = false;
                
                this.plants = [];
                this.zombies = [];
                this.projectiles = [];
                this.suns = [];
                this.particles = [];
                
                this.selectedPlant = 'peashooter';
                this.plantCooldowns = {};
                this.frameCount = 0;
                
                this.upgrades = JSON.parse(localStorage.getItem('pvzUpgrades')) || {};
                
                this.init();
            }
            
            init() {
                this.renderPlants();
                this.renderPhases();
                this.setupEventListeners();
                this.updateUI();
                this.gameLoop();
            }
            
            renderPlants() {
                const grid = document.getElementById('plantsGrid');
                grid.innerHTML = '';
                
                Object.entries(PLANTS).forEach(([key, plant]) => {
                    const upgrade = this.upgrades[key] || 1;
                    const cost = Math.floor(plant.cost * (1 + (upgrade - 1) * 0.2));
                    
                    const card = document.createElement('div');
                    card.className = `plant-card ${this.selectedPlant === key ? 'selected' : ''}`;
                    card.innerHTML = `
                        <div class="plant-emoji">${plant.emoji}</div>
                        <div class="plant-name">${plant.name}</div>
                        <div class="plant-cost">☀️ ${cost}</div>
                        <div class="plant-cooldown">
                            <div class="cooldown-fill" id="cooldown-${key}" style="width: 0%"></div>
                        </div>
                    `;
                    
                    card.addEventListener('click', () => {
                        if (this.sun >= cost && !this.waveInProgress) {
                            this.selectedPlant = key;
                            this.renderPlants();
                        }
                    });
                    
                    grid.appendChild(card);
                });
            }
            
            renderPhases() {
                const grid = document.getElementById('phasesGrid');
                grid.innerHTML = '';
                
                PHASES.forEach((phase, index) => {
                    const isUnlocked = index < this.unlockedPhases;
                    const isCompleted = this.completedPhases.includes(index);
                    
                    const btn = document.createElement('div');
                    btn.className = `phase-btn ${!isUnlocked ? 'locked' : ''} ${isCompleted ? 'completed' : ''}`;
                    btn.innerHTML = `
                        <div>${index + 1}</div>
                        <div class="phase-stars">${isCompleted ? '★★★' : '☆'}</div>
                    `;
                    
                    if (isUnlocked) {
                        btn.addEventListener('click', () => this.loadPhase(index));
                    }
                    
                    grid.appendChild(btn);
                });
            }
            
            loadPhase(index) {
                if (index >= this.unlockedPhases) return;
                
                this.currentPhase = index;
                this.currentWave = 0;
                this.waveInProgress = false;
                this.gameOver = false;
                this.victory = false;
                this.plants = [];
                this.zombies = [];
                this.projectiles = [];
                this.suns = [];
                
                document.getElementById('waveNumber').textContent = '1';
                document.getElementById('totalWaves').textContent = PHASES[index].waves;
                
                this.showNotification(`🌙 Fase ${index + 1}: ${PHASES[index].name}`, 'info');
                this.updateUI();
            }
            
            startWave() {
                if (this.waveInProgress || this.gameOver || this.victory) return;
                if (this.currentWave >= PHASES[this.currentPhase].waves) return;
                
                this.waveInProgress = true;
                this.currentWave++;
                
                const phase = PHASES[this.currentPhase];
                const zombieCount = 5 + this.currentWave * 3;
                
                for (let i = 0; i < zombieCount; i++) {
                    setTimeout(() => {
                        if (!this.waveInProgress) return;
                        
                        const zombieType = phase.zombies[Math.floor(Math.random() * phase.zombies.length)];
                        const row = Math.floor(Math.random() * 5);
                        
                        this.zombies.push({
                            type: zombieType,
                            ...ZOMBIES[zombieType],
                            row,
                            x: 800,
                            y: 60 + row * 85,
                            health: ZOMBIES[zombieType].health,
                            maxHealth: ZOMBIES[zombieType].health
                        });
                    }, i * 500);
                }
                
                document.getElementById('waveNumber').textContent = this.currentWave;
                this.showNotification(`🌊 Onda ${this.currentWave} iniciada!`, 'warning');
            }
            
            update() {
                if (!this.waveInProgress || this.gameOver || this.victory) return;
                
                this.frameCount++;
                
                // Produção de sol
                if (this.frameCount % 60 === 0) {
                    this.sun += 5;
                }
                
                // Plantas produzem sol
                this.plants.forEach(plant => {
                    if (plant.type === 'sunflower' && this.frameCount % 120 === 0) {
                        const upgrade = this.upgrades.sunflower || 1;
                        this.sun += PLANTS.sunflower.sunProduction * upgrade;
                        
                        // Sol visual
                        this.suns.push({
                            x: plant.x + 20,
                            y: plant.y - 10,
                            collected: false
                        });
                    }
                });
                
                // Plantas atiram
                this.plants.forEach(plant => {
                    if (plant.type === 'peashooter' && this.frameCount % 30 === 0) {
                        const upgrade = this.upgrades.peashooter || 1;
                        this.projectiles.push({
                            x: plant.x + 30,
                            y: plant.y + 10,
                            row: plant.row,
                            damage: PLANTS.peashooter.damage * upgrade
                        });
                    }
                    
                    if (plant.type === 'cherry' && this.frameCount % 90 === 0) {
                        const upgrade = this.upgrades.cherry || 1;
                        this.zombies.forEach(zombie => {
                            if (zombie.row === plant.row && Math.abs(zombie.x - plant.x) < 100) {
                                this.createExplosion(plant.x, plant.y);
                                zombie.health -= PLANTS.cherry.damage * upgrade;
                            }
                        });
                    }
                });
                
                // Projéteis
                this.projectiles = this.projectiles.filter(p => {
                    p.x += 5;
                    
                    let hit = false;
                    this.zombies.forEach(z => {
                        if (z.row === p.row && Math.abs(z.x - p.x) < 25 && !hit) {
                            z.health -= p.damage;
                            hit = true;
                            this.particles.push({ x: p.x, y: p.y, type: 'hit', life: 10 });
                        }
                    });
                    
                    return !hit && p.x < 850;
                });
                
                // Zumbis
                this.zombies = this.zombies.filter(zombie => {
                    zombie.x -= zombie.speed;
                    
                    // Colisão com plantas
                    this.plants.forEach(plant => {
                        if (plant.row === zombie.row && Math.abs(zombie.x - plant.x) < 30) {
                            plant.health -= zombie.damage * 0.1;
                            zombie.health -= 2;
                            
                            if (plant.type === 'potato' && plant.health <= 50) {
                                this.createExplosion(plant.x, plant.y);
                                this.zombies.forEach(z => {
                                    if (Math.abs(z.x - plant.x) < PLANTS.potato.explodeRadius) {
                                        z.health -= PLANTS.potato.damage;
                                    }
                                });
                                plant.health = 0;
                            }
                        }
                    });
                    
                    // Zumbi chegou na casa
                    if (zombie.x < 30) {
                        this.gameOver = true;
                        this.showDefeat();
                    }
                    
                    return zombie.health > 0 && zombie.x >= 30;
                });
                
                // Plantas mortas
                this.plants = this.plants.filter(p => p.health > 0);
                
                // Coleta de sol
                this.suns = this.suns.filter(sun => {
                    if (!sun.collected && Math.abs(sun.x - 400) < 30 && Math.abs(sun.y - 100) < 30) {
                        sun.collected = true;
                        this.sun += 25;
                        return false;
                    }
                    return !sun.collected;
                });
                
                // Verifica fim da wave
                if (this.zombies.length === 0 && this.waveInProgress) {
                    this.waveInProgress = false;
                    
                    if (this.currentWave >= PHASES[this.currentPhase].waves) {
                        this.victory = true;
                        this.completePhase();
                    } else {
                        this.showNotification(`✅ Onda ${this.currentWave} completa!`, 'success');
                    }
                }
                
                this.updateUI();
            }
            
            createExplosion(x, y) {
                for (let i = 0; i < 20; i++) {
                    this.particles.push({
                        x: x + (Math.random() - 0.5) * 60,
                        y: y + (Math.random() - 0.5) * 60,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8,
                        type: 'explosion',
                        life: 20 + Math.random() * 20
                    });
                }
            }
            
            completePhase() {
                const phase = PHASES[this.currentPhase];
                this.stars += phase.reward;
                
                if (!this.completedPhases.includes(this.currentPhase)) {
                    this.completedPhases.push(this.currentPhase);
                }
                
                if (this.currentPhase + 1 > this.unlockedPhases) {
                    this.unlockedPhases = this.currentPhase + 1;
                }
                
                localStorage.setItem('pvzStars', this.stars);
                localStorage.setItem('pvzPhases', this.unlockedPhases);
                localStorage.setItem('pvzCompleted', JSON.stringify(this.completedPhases));
                
                this.showVictory();
                this.renderPhases();
                this.updateUI();
            }
            
            draw() {
                this.ctx.clearRect(0, 0, 800, 500);
                
                // Gramado
                for (let i = 0; i < 5; i++) {
                    this.ctx.fillStyle = i % 2 === 0 ? '#4a8a2e' : '#3a7a1e';
                    this.ctx.fillRect(0, i * 85 + 40, 800, 85);
                    
                    this.ctx.strokeStyle = '#2a5a1e';
                    this.ctx.lineWidth = 1;
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, i * 85 + 40);
                    this.ctx.lineTo(800, i * 85 + 40);
                    this.ctx.stroke();
                }
                
                // Casa
                this.ctx.fillStyle = '#8B4513';
                this.ctx.fillRect(10, 50, 30, 400);
                this.ctx.fillStyle = '#A0522D';
                this.ctx.fillRect(0, 30, 50, 40);
                
                // Plantas
                this.plants.forEach(plant => {
                    this.ctx.font = '35px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText(PLANTS[plant.type].emoji, plant.x, plant.y);
                    
                    // Barra de vida
                    this.ctx.fillStyle = '#333';
                    this.ctx.fillRect(plant.x - 25, plant.y - 35, 50, 6);
                    const healthPercent = plant.health / PLANTS[plant.type].health;
                    this.ctx.fillStyle = healthPercent > 0.5 ? '#00ff88' : '#ffd700';
                    this.ctx.fillRect(plant.x - 25, plant.y - 35, 50 * healthPercent, 6);
                });
                
                // Zumbis
                this.zombies.forEach(zombie => {
                    this.ctx.font = '40px Arial';
                    this.ctx.fillText(zombie.emoji, zombie.x, zombie.y);
                    
                    // Barra de vida
                    this.ctx.fillStyle = '#333';
                    this.ctx.fillRect(zombie.x - 25, zombie.y - 45, 50, 6);
                    const healthPercent = zombie.health / zombie.maxHealth;
                    this.ctx.fillStyle = '#ff4444';
                    this.ctx.fillRect(zombie.x - 25, zombie.y - 45, 50 * healthPercent, 6);
                });
                
                // Projéteis
                this.projectiles.forEach(p => {
                    this.ctx.fillStyle = '#ffff00';
                    this.ctx.shadowColor = '#ffff00';
                    this.ctx.shadowBlur = 10;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.shadowBlur = 0;
                });
                
                // Sóis
                this.suns.forEach(sun => {
                    this.ctx.fillStyle = '#ffd700';
                    this.ctx.shadowColor = '#ffd700';
                    this.ctx.shadowBlur = 15;
                    this.ctx.beginPath();
                    this.ctx.arc(sun.x, sun.y, 12, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.shadowBlur = 0;
                    this.ctx.fillStyle = '#fff7b0';
                    this.ctx.beginPath();
                    this.ctx.arc(sun.x - 3, sun.y - 3, 4, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                
                // Partículas
                this.particles = this.particles.filter(p => {
                    p.x += p.vx || 0;
                    p.y += p.vy || 0;
                    p.life--;
                    
                    this.ctx.fillStyle = p.type === 'explosion' ? '#ff6600' : '#ffff00';
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    return p.life > 0;
                });
            }
            
            plantAt(col, row) {
                const cost = Math.floor(PLANTS[this.selectedPlant].cost * (1 + ((this.upgrades[this.selectedPlant] || 1) - 1) * 0.2));
                
                if (this.sun < cost) {
                    this.showNotification('☀️ Sol insuficiente!', 'error');
                    return;
                }
                
                if (this.plants.some(p => p.col === col && p.row === row)) {
                    this.showNotification('❌ Já tem uma planta aí!', 'error');
                    return;
                }
                
                this.sun -= cost;
                this.plants.push({
                    type: this.selectedPlant,
                    col, row,
                    x: col * 90 + 100,
                    y: row * 85 + 80,
                    health: PLANTS[this.selectedPlant].health
                });
                
                this.renderPlants();
            }
            
            updateUI() {
                document.getElementById('sunDisplay').textContent = Math.floor(this.sun);
                document.getElementById('starsDisplay').textContent = this.stars;
                document.getElementById('zombiesAlive').textContent = this.zombies.length;
                
                const wavePercent = (this.currentWave / PHASES[this.currentPhase].waves) * 100;
                document.getElementById('waveFill').style.width = wavePercent + '%';
            }
            
            showVictory() {
                document.getElementById('modalTitle').className = 'modal-title victory-title';
                document.getElementById('modalTitle').textContent = '🏆 VITÓRIA! 🏆';
                document.getElementById('starsEarned').innerHTML = '⭐⭐⭐';
                document.getElementById('modalMessage').textContent = `Você ganhou ${PHASES[this.currentPhase].reward} estrelas!`;
                document.getElementById('resultModal').style.display = 'flex';
            }
            
            showDefeat() {
                document.getElementById('modalTitle').className = 'modal-title defeat-title';
                document.getElementById('modalTitle').textContent = '💀 DERROTA 💀';
                document.getElementById('starsEarned').innerHTML = '';
                document.getElementById('modalMessage').textContent = 'Os zumbis comeram seu cérebro... Tente novamente!';
                document.getElementById('resultModal').style.display = 'flex';
            }
            
            showNotification(text, type) {
                const existing = document.querySelector('.notification');
                if (existing) existing.remove();
                
                const notif = document.createElement('div');
                notif.className = 'notification';
                notif.innerHTML = text;
                document.body.appendChild(notif);
                
                setTimeout(() => notif.remove(), 2000);
            }
            
            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
            
            setupEventListeners() {
                this.canvas.addEventListener('click', (e) => {
                    if (this.waveInProgress) return;
                    
                    const rect = this.canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const col = Math.floor((x - 60) / 90);
                    const row = Math.floor((y - 40) / 85);
                    
                    if (col >= 0 && col < 7 && row >= 0 && row < 5) {
                        this.plantAt(col, row);
                    }
                });
                
                document.getElementById('startWaveBtn').addEventListener('click', () => this.startWave());
                
                document.getElementById('shopBtn').addEventListener('click', () => {
                    this.renderShop();
                    document.getElementById('shopModal').style.display = 'flex';
                });
                
                document.getElementById('closeShop').addEventListener('click', () => {
                    document.getElementById('shopModal').style.display = 'none';
                });
                
                document.getElementById('resetBtn').addEventListener('click', () => {
                    if (confirm('Reiniciar o progresso?')) {
                        localStorage.clear();
                        location.reload();
                    }
                });
                
                document.getElementById('modalContinue').addEventListener('click', () => {
                    document.getElementById('resultModal').style.display = 'none';
                    if (this.victory) {
                        this.loadPhase(this.currentPhase + 1);
                    } else {
                        this.loadPhase(this.currentPhase);
                    }
                });
            }
            
            renderShop() {
                const container = document.getElementById('shopUpgrades');
                container.innerHTML = '';
                
                Object.entries(PLANTS).forEach(([key, plant]) => {
                    const level = this.upgrades[key] || 1;
                    const cost = 5 * level;
                    
                    const div = document.createElement('div');
                    div.className = 'plant-upgrade';
                    div.innerHTML = `
                        <span>${plant.emoji} ${plant.name} Nv.${level}</span>
                        <button class="upgrade-btn" data-plant="${key}" data-cost="${cost}">
                            ⭐ ${cost} Melhorar
                        </button>
                    `;
                    container.appendChild(div);
                });
                
                document.getElementById('shopStars').textContent = this.stars;
                
                document.querySelectorAll('.upgrade-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const plant = e.target.dataset.plant;
                        const cost = parseInt(e.target.dataset.cost);
                        
                        if (this.stars >= cost) {
                            this.stars -= cost;
                            this.upgrades[plant] = (this.upgrades[plant] || 1) + 1;
                            localStorage.setItem('pvzStars', this.stars);
                            localStorage.setItem('pvzUpgrades', JSON.stringify(this.upgrades));
                            this.renderShop();
                            this.renderPlants();
                            this.updateUI();
                            this.showNotification(`✅ ${PLANTS[plant].name} melhorada!`, 'success');
                        } else {
                            this.showNotification('❌ Estrelas insuficientes!', 'error');
                        }
                    });
                });
            }
        }
        
        // Inicializa o jogo
        const game = new PlantsVsZombies();
    </script>
</body>
